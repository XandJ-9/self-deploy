[package]
name = "self-deploy-tauri-core"
version = "1.0.1"
description = "Shared Tauri backend for SelfDeploy"
authors = ["SelfDeploy"]
edition = "2021"
rust-version = "1.77.2"

[dependencies]
ftp = "3"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
winapi = { version = "0.3", features = ["dpapi", "errhandlingapi", "winbase", "wincrypt"] }
