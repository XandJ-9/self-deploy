[package]
name = "self-deploy-mac"
version = "1.0.1"
description = "本地项目快速部署到服务器的桌面工具（SFTP/FTP + Git 增量）"
authors = ["SelfDeploy"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
self-deploy-tauri-core = { path = "../../packages/tauri-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
