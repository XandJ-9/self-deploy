[package]
name = "self-deploy"
version = "1.0.1"
description = "本地项目快速部署到服务器的桌面工具（SFTP/FTP + Git 增量）"
authors = ["SelfDeploy"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ftp = "3"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
winapi = { version = "0.3", features = ["dpapi", "errhandlingapi", "winbase", "wincrypt"] }
