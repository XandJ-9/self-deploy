name: Platform Matrix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Contract tests
        run: npm run test:contract

  build-win-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: npm ci
      - name: Build windows app (Tauri)
        run: npm run build:win

  build-mac-tauri:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: npm ci
      - name: Build mac app (Tauri)
        run: npm run build:mac
